# nginx config snippet for STB Singapore subdomains
# Drop into /etc/nginx/sites-available/stb.conf and symlink to sites-enabled.
# All three hostnames proxy to the same Node process on PORT 3003.
# The Express app handles host-based routing (see server.js).

# Rate-limit zone shared across admin/api hosts
limit_req_zone $binary_remote_addr zone=stb_api:10m rate=30r/s;

# Upstream — Node listens on 127.0.0.1:3003
upstream stb_app {
    server 127.0.0.1:3003;
    keepalive 32;
}

# ─── MAIN LANDING (singaporetourbooking.com + www.) ───
server {
    listen 443 ssl http2;
    server_name singaporetourbooking.com www.singaporetourbooking.com;

    ssl_certificate     /etc/letsencrypt/live/singaporetourbooking.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/singaporetourbooking.com/privkey.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://stb_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

# ─── ADMIN SPA (admin.singaporetourbooking.com) ───
server {
    listen 443 ssl http2;
    server_name admin.singaporetourbooking.com;

    ssl_certificate     /etc/letsencrypt/live/singaporetourbooking.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/singaporetourbooking.com/privkey.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://stb_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

# ─── API (api.singaporetourbooking.com) ───
server {
    listen 443 ssl http2;
    server_name api.singaporetourbooking.com;

    ssl_certificate     /etc/letsencrypt/live/singaporetourbooking.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/singaporetourbooking.com/privkey.pem;

    client_max_body_size 12m;

    # Tighten CORS preflight + JSON endpoints
    location / {
        limit_req zone=stb_api burst=60 nodelay;

        proxy_pass http://stb_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

# ─── HTTP → HTTPS redirect for all three hosts ───
server {
    listen 80;
    server_name singaporetourbooking.com www.singaporetourbooking.com
                admin.singaporetourbooking.com api.singaporetourbooking.com;
    return 301 https://$host$request_uri;
}