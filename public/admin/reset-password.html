<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — STB Admin</title>
  <link rel="icon" href="/stb-logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#FBF7F0; --card:#fff; --primary:#141414; --accent:#E31E24; --muted:#888; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Manrope',sans-serif; background:var(--bg); color:var(--primary); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background:var(--card); border:1px solid #e0deda; border-radius:16px; padding:36px; max-width:420px; width:100%; box-shadow:0 8px 32px rgba(20,20,20,.08); }
    .logo { width:64px; height:64px; margin:0 auto 16px; display:block; }
    h1 { font-family:'Fraunces',serif; font-weight:700; margin:0 0 6px; text-align:center; font-size:1.4rem; }
    .sub { color:var(--muted); text-align:center; margin-bottom:24px; font-size:0.88rem; }
    label { display:block; font-size:0.82rem; font-weight:600; margin:14px 0 6px; }
    input { width:100%; padding:11px 12px; border:1px solid #d4d0c8; border-radius:8px; font:inherit; background:#fff; }
    input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(227,30,36,.12); }
    button { width:100%; margin-top:20px; padding:12px; background:var(--accent); color:#fff; border:0; border-radius:8px; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .msg { margin-top:14px; padding:10px 12px; border-radius:8px; font-size:0.85rem; text-align:center; display:none; }
    .msg.success { background:#e8f5e9; color:#1b5e20; display:block; }
    .msg.error { background:#fdecec; color:var(--accent); display:block; }
    a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/stb-logo.png" alt="STB" class="logo">
    <h1>Reset Password</h1>
    <p class="sub">Enter your new password below.</p>
    <form id="form">
      <label>New Password (min 8 chars)</label>
      <input type="password" id="pw" minlength="8" required autofocus>
      <label>Confirm Password</label>
      <input type="password" id="pw2" minlength="8" required>
      <button type="submit" id="btn">Reset Password</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const API_ORIGIN = location.hostname.startsWith('admin.') ? 'https://api.singaporetourbooking.com' : '';
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');
    const form = document.getElementById('form');
    if (!token) {
      msg.className = 'msg error';
      msg.textContent = 'Missing or invalid reset link.';
      form.style.display = 'none';
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw !== pw2) {
        msg.className = 'msg error';
        msg.textContent = 'Passwords do not match.';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Resetting…';
      try {
        const res = await fetch(`${API_ORIGIN}/api/admin/auth/reset-password`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pw })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        msg.className = 'msg success';
        msg.innerHTML = 'Password reset successful. You can now <a href="/">sign in</a>.';
        form.style.display = 'none';
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
