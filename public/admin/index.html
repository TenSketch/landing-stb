<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin — STB Singapore</title>
  <link rel="icon" href="/stb-logo.png" />
  <link rel="manifest" href="/admin/manifest.json" />
  <meta name="theme-color" content="#E31E24">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    // Icon-font fallback for admin (Google stays primary; unpkg is backup).
    (function () {
      var started = false, done = false, tries = 0;
      function hasIconFace() {
        try {
          var loaded = false, error = false;
          document.fonts.forEach(function (f) {
            if (String(f.family).indexOf('Material Symbols') !== -1) {
              if (f.status === 'loaded') loaded = true;
              if (f.status === 'error') error = true;
            }
          });
          return { loaded: loaded, error: error };
        } catch (e) { return { loaded: false, error: false }; }
      }
      function tick() {
        if (done) return;
        tries++;
        var state = hasIconFace();
        if (state.loaded) { done = true; return; }
        if (tries >= 3 || state.error) {
          done = true;
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = 'https://unpkg.com/@material-symbols/font-400@0.28.0/outlined.css?v=2';
          document.head.appendChild(l);
          return;
        }
        setTimeout(tick, 1000);
      }
      function start() { if (started) return; started = true; setTimeout(tick, 1000); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();
  </script>
  <link rel="stylesheet" href="/admin/admin.css?v=7">
</head>
<body>
  <div id="root">
    <div style="font-family: system-ui, sans-serif; padding: 40px; text-align: center; color: #333;">
      <p>Loading admin panel...</p>
      <noscript>
        <p style="color: #c00;"><strong>Admin panel requires JavaScript.</strong></p>
      </noscript>
    </div>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="/admin/app.js?v=8" type="module"></script>
</body>
</html>
